name: release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-v1-5-0:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v1.5.0
      RELEASE_TARGET: 2ed3c6601a49b4e76f4fe856f04165ea47158f2c
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TARGET }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate
        run: cargo check --release

      - name: Build
        run: cargo build --release

      - name: Prepare release package
        shell: pwsh
        run: |
          $dir = 'dist/QuietGuard-v1.5.0-windows-x64'
          New-Item -ItemType Directory -Force -Path "$dir/rules" | Out-Null
          Copy-Item target/release/quietguard.exe "$dir/QuietGuard.exe"
          Copy-Item rules/heuristics.conf "$dir/rules/heuristics.conf"
          Copy-Item rules/version.json "$dir/rules/version.json"
          Compress-Archive -Path "$dir/*" -DestinationPath 'dist/QuietGuard-v1.5.0-windows-x64.zip' -Force
          (Get-FileHash 'dist/QuietGuard-v1.5.0-windows-x64.zip' -Algorithm SHA256).Hash.ToLower() | Set-Content 'dist/QuietGuard-v1.5.0-windows-x64.zip.sha256'

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          QuietGuard v1.5.0

          Automation and responsiveness release.

          Changes:
          - Add opt-in Windows startup toggle
          - Add opt-in real-time monitor autostart toggle
          - Add opt-in scheduled DB update toggle
          - Keep all new automation disabled until the user explicitly enables each setting
          - Run manual DB updates outside the GUI thread to prevent Windows 'Not Responding' during network/parsing work
          - Prevent overlapping DB refreshes with a named Windows mutex
          - Avoid duplicate successful ThreatFox refreshes; compatibility retry runs only after primary failure
          - Add a bounded ThreatFox compatibility request timeout
          - Preserve abuse.ch Auth-Key configuration and low-memory disk indexes

          DB cadence when scheduled updates are enabled:
          - ThreatFox/URLhaus: 6 hours
          - Public PUP/domain feeds and YousList: 24 hours
          - ClamAV update check: 24 hours when installed

          SHA-256 is attached alongside the Windows x64 ZIP.
          "@

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG 'dist/QuietGuard-v1.5.0-windows-x64.zip' 'dist/QuietGuard-v1.5.0-windows-x64.zip.sha256' --clobber
          } else {
            gh release create $env:RELEASE_TAG 'dist/QuietGuard-v1.5.0-windows-x64.zip' 'dist/QuietGuard-v1.5.0-windows-x64.zip.sha256' --target $env:RELEASE_TARGET --title 'QuietGuard v1.5.0' --notes $notes
          }

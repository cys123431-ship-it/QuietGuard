name: release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-v1-6-0:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v1.6.0
      RELEASE_TARGET: ${{ github.sha }}
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TARGET }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate
        run: cargo check --release

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Prepare release package
        shell: pwsh
        run: |
          $dir = 'dist/QuietGuard-v1.6.0-windows-x64'
          New-Item -ItemType Directory -Force -Path "$dir/rules" | Out-Null
          Copy-Item target/release/quietguard.exe "$dir/QuietGuard.exe"
          Copy-Item rules/heuristics.conf "$dir/rules/heuristics.conf"
          Copy-Item rules/version.json "$dir/rules/version.json"
          Compress-Archive -Path "$dir/*" -DestinationPath 'dist/QuietGuard-v1.6.0-windows-x64.zip' -Force
          (Get-FileHash 'dist/QuietGuard-v1.6.0-windows-x64.zip' -Algorithm SHA256).Hash.ToLower() | Set-Content 'dist/QuietGuard-v1.6.0-windows-x64.zip.sha256'

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          QuietGuard v1.6.0

          Safe application self-update release.

          Changes:
          - Add opt-in application auto-update scheduling every 6 hours
          - Check only the latest official GitHub Release, not development commits
          - Download the versioned Windows x64 ZIP and SHA-256 companion over HTTPS
          - Verify the release ZIP before extraction or replacement
          - Stage the new executable and bundled rule files under LocalAppData
          - Use the newly downloaded QuietGuard executable as an out-of-process replacement helper
          - Keep QuietGuard.exe.previous as a rollback copy
          - Stop the low-memory watcher only after a verified newer version is ready and restart it after the update attempt
          - Leave the installed version intact if another QuietGuard process keeps the executable locked, then retry on the next scheduled check
          - Write application update results to app-update.log
          - Keep all detection/remediation behavior read-only; no automatic deletion or quarantine

          Security note:
          - SHA-256 protects against corrupted or mismatched release assets.
          - Independent publisher-signed update metadata remains a future hardening target.

          SHA-256 is attached alongside the Windows x64 ZIP.
          "@

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG 'dist/QuietGuard-v1.6.0-windows-x64.zip' 'dist/QuietGuard-v1.6.0-windows-x64.zip.sha256' --clobber
          } else {
            gh release create $env:RELEASE_TAG 'dist/QuietGuard-v1.6.0-windows-x64.zip' 'dist/QuietGuard-v1.6.0-windows-x64.zip.sha256' --target $env:RELEASE_TARGET --title 'QuietGuard v1.6.0' --notes $notes
          }

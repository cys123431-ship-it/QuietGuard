name: release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-v1-4-1:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v1.4.1
      RELEASE_TARGET: abc460985ed2244b87bef9b5132aaa0dfa28d165
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TARGET }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate
        run: cargo check --release

      - name: Build
        run: cargo build --release

      - name: Prepare release package
        shell: pwsh
        run: |
          $dir = 'dist/QuietGuard-v1.4.1-windows-x64'
          New-Item -ItemType Directory -Force -Path "$dir/rules" | Out-Null
          Copy-Item target/release/quietguard.exe "$dir/QuietGuard.exe"
          Copy-Item rules/heuristics.conf "$dir/rules/heuristics.conf"
          Copy-Item rules/version.json "$dir/rules/version.json"
          Compress-Archive -Path "$dir/*" -DestinationPath 'dist/QuietGuard-v1.4.1-windows-x64.zip' -Force
          (Get-FileHash 'dist/QuietGuard-v1.4.1-windows-x64.zip' -Algorithm SHA256).Hash.ToLower() | Set-Content 'dist/QuietGuard-v1.4.1-windows-x64.zip.sha256'

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          QuietGuard v1.4.1

          Maintenance release fixing ThreatFox Community API updates on Windows.

          Changes:
          - Fix ThreatFox updater after real-world Windows testing
          - Use the documented Auth-Key header and get_iocs/days=7 request through Invoke-RestMethod
          - Keep ThreatFox and URLhaus low-memory disk caches independent
          - Preserve last-known-good ThreatFox data if a refresh fails
          - No change to the existing abuse.ch Auth-Key configuration file

          SHA-256 is attached alongside the Windows x64 ZIP.
          "@

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG 'dist/QuietGuard-v1.4.1-windows-x64.zip' 'dist/QuietGuard-v1.4.1-windows-x64.zip.sha256' --clobber
          } else {
            gh release create $env:RELEASE_TAG 'dist/QuietGuard-v1.4.1-windows-x64.zip' 'dist/QuietGuard-v1.4.1-windows-x64.zip.sha256' --target $env:RELEASE_TARGET --title 'QuietGuard v1.4.1' --notes $notes
          }

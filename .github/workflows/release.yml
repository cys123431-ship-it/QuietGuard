name: release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-v1-5-1:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v1.5.1
      RELEASE_TARGET: ${{ github.sha }}
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TARGET }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate
        run: cargo check --release

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Prepare release package
        shell: pwsh
        run: |
          $dir = 'dist/QuietGuard-v1.5.1-windows-x64'
          New-Item -ItemType Directory -Force -Path "$dir/rules" | Out-Null
          Copy-Item target/release/quietguard.exe "$dir/QuietGuard.exe"
          Copy-Item rules/heuristics.conf "$dir/rules/heuristics.conf"
          Copy-Item rules/version.json "$dir/rules/version.json"
          Compress-Archive -Path "$dir/*" -DestinationPath 'dist/QuietGuard-v1.5.1-windows-x64.zip' -Force
          (Get-FileHash 'dist/QuietGuard-v1.5.1-windows-x64.zip' -Algorithm SHA256).Hash.ToLower() | Set-Content 'dist/QuietGuard-v1.5.1-windows-x64.zip.sha256'

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          QuietGuard v1.5.1

          Repository-wide hardening release.

          Changes:
          - Retry registration for monitored registry keys that are created after the watcher starts
          - Validate Windows startup, monitor autostart and scheduled DB task paths against the current executable
          - Run system scans and baseline save/compare outside the GUI thread
          - Suppress helper console windows in core scan modules
          - Add baseline schema/version metadata, previous-baseline backup and volatile DB-status filtering
          - Fix external heuristic path separator compatibility
          - Validate Chromium extension update URLs by exact HTTPS host and compare extension versions numerically
          - Track public and abuse.ch refresh times per source so failed feeds retry independently
          - Add rollback-safe replacement for rule and domain index files
          - Add bounded HTTP requests and bounded optional ClamAV/FreshClam helper execution
          - Improve ClamAV indirect candidate extraction
          - Ignore local secrets.conf files in Git
          - Add Windows cargo test execution to CI and release validation
          - Keep all detection read-only; no automatic deletion or quarantine

          Scheduled cadence remains:
          - ThreatFox/URLhaus: 6 hours per source
          - Public PUP/domain feeds and YousList: 24 hours
          - ClamAV update check: 24 hours when installed

          SHA-256 is attached alongside the Windows x64 ZIP.
          "@

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG 'dist/QuietGuard-v1.5.1-windows-x64.zip' 'dist/QuietGuard-v1.5.1-windows-x64.zip.sha256' --clobber
          } else {
            gh release create $env:RELEASE_TAG 'dist/QuietGuard-v1.5.1-windows-x64.zip' 'dist/QuietGuard-v1.5.1-windows-x64.zip.sha256' --target $env:RELEASE_TARGET --title 'QuietGuard v1.5.1' --notes $notes
          }
